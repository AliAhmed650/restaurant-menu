<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>منصة المنيو الرقمي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* Layout: public mobile-first menu (cover, offers, filters, grid) + admin shell (sidebar + content). Warm olive-ink on cream, one editable accent. */
:root{
  --bg:#faf8f4; --card:#ffffff; --card2:#f4f1e9; --line:#e8e3d6; --ink:#1f1b13; --mute:#6f6858;
  --primary:#38310f; --on-primary:#ffffff; --accent:#c2571a; --on-accent:#ffffff;
  --ok:#1e7a46; --warn:#a86a0c; --bad:#c0392b; --shadow:0 1px 2px rgba(40,30,0,.05),0 8px 24px rgba(40,30,0,.06);
  --font-body:'Cairo',system-ui,sans-serif; --font-display:'Fraunces','Amiri',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14120d; --card:#1e1b14; --card2:#27231a; --line:#35301f; --ink:#f1ece0; --mute:#a69e8a;
    --primary:#e9e0b6; --on-primary:#1c1805; --ok:#4cc38a; --warn:#e0a548; --bad:#ef7b6d; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14120d; --card:#1e1b14; --card2:#27231a; --line:#35301f; --ink:#f1ece0; --mute:#a69e8a;
  --primary:#e9e0b6; --on-primary:#1c1805; --ok:#4cc38a; --warn:#e0a548; --bad:#ef7b6d; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;margin:0;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
body.lock{overflow:hidden}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:600;text-decoration:none;min-height:40px}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.acc{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 12px;min-height:32px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;padding:0}
.iconbtn .cnt{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--card2)}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--card))}
.pill.acc{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}

/* public */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.top .acts{display:flex;gap:8px;align-items:center}
.top .brand-s{font-family:var(--font-display);font-weight:700;font-size:18px}
.cover{position:relative;border-radius:20px;overflow:hidden;min-height:150px;
  background:radial-gradient(circle at 15% 20%,color-mix(in srgb,var(--accent) 55%,#fff) 0,transparent 35%),radial-gradient(circle at 85% 80%,color-mix(in srgb,var(--accent) 40%,#000) 0,transparent 45%),linear-gradient(135deg,color-mix(in srgb,var(--accent) 70%,#000),#2b2410)}
.cover .glyph{position:absolute;inset-inline-end:24px;bottom:-18px;font-size:150px;opacity:.18;line-height:1}
.ident{display:flex;gap:16px;align-items:flex-end;margin:-44px 20px 0;position:relative;flex-wrap:wrap}
.logo{width:88px;height:88px;border-radius:50%;background:#2b2410;border:4px solid var(--bg);display:grid;place-items:center;font-size:42px;flex:none}
.ident .txt{flex:1;min-width:200px;padding-top:48px}
.ident h1{font-size:28px}
.ident p{margin:2px 0 0;color:var(--mute)}
.info-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sec{margin-top:28px}
.sec>h2{font-size:20px;display:flex;gap:8px;align-items:center;margin-bottom:12px}
.offers{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.offer{flex:0 0 min(300px,82%);scroll-snap-align:start;border-radius:16px;padding:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;text-align:start;cursor:pointer}
.offer .bd{align-self:flex-start;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.offer h3{font-size:16px}.offer p{margin:0;color:var(--mute);font-size:13px}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.mini{flex:0 0 140px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:start;padding:0}
.mini img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.mini div{padding:6px 10px 10px;font-size:13px;font-weight:600}
.mini small{display:block;color:var(--mute);font-weight:400}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 16px;min-height:46px}
.search input{border:0;background:none;flex:1;outline:0;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chip.f.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cat-h{margin:24px 0 12px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.grid.list{grid-template-columns:1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;min-width:0;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.list .card{flex-direction:row}
.list .card .ph{width:130px;flex:none;aspect-ratio:auto}
.ph{position:relative;aspect-ratio:4/3;background:var(--card2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .tp{position:absolute;top:8px;inset-inline-start:8px}
.card.out .ph img{filter:grayscale(1);opacity:.55}
.soldout{position:absolute;inset:0;display:grid;place-items:center}
.soldout span{background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;padding:4px 14px;border-radius:999px}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.cb h3{font-size:16px}
.cb p{margin:0;color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.price{font-weight:700;font-size:16px}
.tags{display:flex;gap:4px}
.tg{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--card2)}
.tg .ic{width:14px;height:14px}
.tg.veg{color:var(--ok)}.tg.spicy{color:var(--bad)}
.add{width:36px;height:36px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;padding:0;flex:none}
.add[disabled]{opacity:.35}
.empty{text-align:center;color:var(--mute);padding:40px 16px;border:1px dashed var(--line);border-radius:16px}
footer.f{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* modal / drawer */
.scrim{position:fixed;inset:0;background:rgba(10,8,0,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);color:var(--ink);border-radius:20px;max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.sheet .bd{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.sheet .ft{padding:12px 20px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet .big{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-radius:20px 20px 0 0}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.in{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;min-height:40px;width:100%;min-width:0}
textarea.in{min-height:72px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-size:13px;margin:0;min-height:0}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.qty{display:inline-flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);padding:0;display:grid;place-items:center}
.line{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line small{display:block;color:var(--mute)}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px}
.toasts{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:up .2s}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* admin */
.adm{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;margin-top:12px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--bg);min-height:640px}
.side{background:var(--card);border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.side .t{font-family:var(--font-display);font-size:20px;font-weight:700;padding:0 8px 12px}
.me{display:flex;gap:10px;align-items:center;padding:10px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px;flex-wrap:wrap}
.av{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700}
.me b{display:block;font-size:13px;line-height:1.2}.me small{color:var(--mute);font-size:11px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:600;color:var(--ink)}
.nav:hover{background:var(--card2)}
.nav.on{background:var(--primary);color:var(--on-primary)}
.nav .bdg{margin-inline-start:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.side .sp{flex:1;min-height:12px}
.main{padding:28px;min-width:0}
.main h2{font-size:24px}
.sub{color:var(--mute);margin:2px 0 20px}
.hd2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.stat .r{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--mute)}
.stat .v{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1}
.stat .bx{width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.qa a{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;font-weight:600}
.qa a:hover{border-color:var(--accent)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.prow{display:grid;grid-template-columns:24px 52px minmax(0,1fr) 110px auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow.dragging{opacity:.4}.prow.over{outline:2px dashed var(--accent);outline-offset:-2px}
.prow .dh{cursor:grab;color:var(--mute);touch-action:none}
.prow img{width:52px;height:52px;border-radius:10px;object-fit:cover;display:block}
.prow .nm{min-width:0}.prow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prow .nm small{color:var(--mute)}
.pi{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;font-weight:700;text-align:start}
.pi:hover,.pi:focus{border-color:var(--line);background:var(--bg)}
.acts2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sw{width:42px;height:24px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.sw.on{background:var(--ok)}.sw.on::after{inset-inline-start:21px}
.sbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.sbtn.on{color:var(--warn);border-color:var(--warn)}
.sbtn.bad{color:var(--bad)}
.lr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lr:last-child{border-bottom:0}.lr .g{flex:1;min-width:140px}.lr .g small{display:block;color:var(--mute)}
.ord{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ord:last-child{border-bottom:0}
.ord .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.form{display:flex;flex-direction:column;gap:14px;max-width:560px}
.sw-c{display:flex;gap:10px;flex-wrap:wrap}
.cs{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0}
.cs.on{box-shadow:0 0 0 2px var(--ink)}
.qrbox{background:#fff;padding:16px;border-radius:16px;width:min(280px,100%);border:1px solid var(--line)}
.qrbox svg{width:100%;height:auto;display:block}
.login{max-width:400px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.dz{border:2px dashed var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;background:var(--bg)}
.dz.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--bg))}
.dz img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.note{font-size:12px;color:var(--mute)}
.scroll-x{overflow-x:auto}
@media (max-width:820px){
  .adm{grid-template-columns:1fr}
  .side{border-inline-end:0;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;padding:10px;align-items:center}
  .side .t,.side .me,.side .sp{display:none}
  .nav{flex:none;white-space:nowrap}
  .main{padding:18px 14px}
  .prow{grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"i n a" "i p a"}
  .prow .dh{display:none}.prow img{width:44px;height:44px;grid-area:i}.prow .nm{grid-area:n}.prow .pw{grid-area:p}.prow .acts2{grid-area:a}
  .row2{grid-template-columns:1fr}
  .ident h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== v3 design layer: same tokens, richer treatment ===== */
:root{--ember:#1b130a;--side:#26200d;--on-side:#f4efdc;--side-line:rgba(255,255,255,.08);--shadow-lg:0 2px 4px rgba(40,30,0,.06),0 24px 60px rgba(40,30,0,.16);--hh:64px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--side:#1a170c;--ember:#0f0a05}}
:root[data-theme="dark"]{--side:#1a170c;--ember:#0f0a05}
body{font-size:15.5px}
h1,h2,h3{font-family:var(--font-body);font-weight:700;letter-spacing:-.01em}
.top{height:var(--hh);padding:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.brand-s{display:flex;align-items:center;gap:10px;font-family:'Amiri','Fraunces',serif;font-weight:700;font-size:23px}
.mlogo{width:38px;height:38px;border-radius:50%;background:#2b2410;display:grid;place-items:center;font-size:19px;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
.iconbtn{transition:transform .15s,box-shadow .15s,background .15s}
.iconbtn:hover{transform:translateY(-1px);box-shadow:var(--shadow);background:var(--card2)}
.btn{transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.acc{box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 38%,transparent)}
/* hero */
.hero{position:relative;border-radius:30px;overflow:hidden;color:#fff;background:radial-gradient(620px 340px at 12% -10%,color-mix(in srgb,var(--accent) 62%,transparent),transparent 70%),radial-gradient(520px 360px at 100% 110%,color-mix(in srgb,var(--accent) 38%,transparent),transparent 70%),linear-gradient(135deg,#33230f,var(--ember));box-shadow:var(--shadow-lg)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.4px);background-size:22px 22px;-webkit-mask-image:linear-gradient(135deg,#000,transparent 75%);mask-image:linear-gradient(135deg,#000,transparent 75%)}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;align-items:center;padding:44px 44px}
.hero .logo{width:76px;height:76px;border-radius:50%;background:#2b2410;border:3px solid color-mix(in srgb,var(--accent) 70%,#fff);display:grid;place-items:center;font-size:38px;margin-bottom:16px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.hero h1{font-family:'Amiri','Fraunces',serif;font-weight:700;font-size:clamp(38px,6vw,64px);line-height:1.1;margin:10px 0 6px}
.hero .tag{margin:0 0 18px;color:rgba(255,255,255,.78);font-size:17px}
.hero .pill{background:rgba(255,255,255,.12);color:#fff;backdrop-filter:blur(6px)}

    if(f.type==='number'&&!err){if(v===''||isNaN(Number(v))||Number(v)<0)err=L('أدخل رقمًا صحيحًا في: ','Enter a valid number in: ')+f.label;v=Number(v)}
    vals[f.id]=v});

  if(err){var e=document.getElementById('mferr');if(e)e.textContent=err;return}
  ui.modal=null;ui.draftImg=null;drawModal();save();render();
}

function addToCart(pid,ex,qty){
  var p=prod(pid);if(!p||!p.avail){toast(L('الصنف غير متاح','Item unavailable'));return}
  var it={pid:pid,ex:ex.slice(),qty:qty},k=cartKey(it),f=ui.cart.filter(function(x){return cartKey(x)===k})[0];
  if(f)f.qty=Math.min(20,f.qty+qty);else ui.cart.push(it);
  saveCart();toast(L('تمت الإضافة للسلة','Added to cart'));render();
}
function submitOrder(){
  if(ui.submitting)return;
  var m=ui.modal,name=(m.name||'').trim(),err='';
  if(!S.info.open)err=L('المطعم مغلق حاليًا','The restaurant is closed');
  else if(!name)err=L('اكتب اسمك أو رقم الطاولة','Enter your name or table number');
  else if(ui.cart.some(function(i){var p=prod(i.pid);return !p||!p.avail}))err=L('في صنف مش متاح. احذفه وكمّل.','An item is unavailable. Remove it to continue.');
  if(err){var e=$('#cerr');if(e)e.textContent=err;return}
  var sig=JSON.stringify(ui.cart)+name,last=ui.lastSig;
  if(last&&last.sig===sig&&Date.now()-last.t<15000){ui.modal={kind:'cart',done:true};drawModal();toast(L('طلبك اتسجّل بالفعل','Your order was already received'));return}
  ui.submitting=true;
  var items=ui.cart.map(function(i){var p=prod(i.pid);return {pid:i.pid,name:p.name,qty:i.qty,price:p.price,extras:i.ex.map(function(id){var x=S.extras.filter(function(y){return y.id===id})[0];return x?{ar:x.name.ar,en:x.name.en,price:x.price}:null}).filter(Boolean)}});
  var o={id:Number(String(Date.now()).slice(-7)),t:Date.now(),name:name,items:items,total:cartTotal(),status:'pending',note:(m.note||'').trim()};
  var fin=function(){ui.lastOrder=o.id;ui.lastSig={sig:sig,t:Date.now()};ui.cart=[];saveCart();ui.submitting=false;ui.modal={kind:'cart',done:true};drawModal();render()};
  if(DB&&USER){
    sendOrderDb(o).then(fin,function(){ui.submitting=false;keepCartFields();drawModal();var e=$('#cerr');if(e)e.textContent=L('تعذر إرسال الطلب للمطعم. تأكد إنك مسجّل دخول وجرّب تاني.','Could not send the order. Make sure you are signed in and try again.')});
  }else{S.orders.push(o);save();fin()}
}

var DB=null,USER=null,dbR={main:null,mainLoaded:false,images:{},orderDocs:{},seeded:false},lastMain='',pushT=null,pushing=false,dirty=false;
function canWrite(){try{return !!(USER&&USER.canEdit&&USER.canEdit()===true)}catch(e){return false}}
function mainPayload(){return {info:S.info,theme:S.theme,cats:S.cats,extras:S.extras,offers:S.offers,products:S.products.map(function(p){var q=Object.assign({},p);q.img=null;return q})}}
function schedulePush(){if(!DB||!canWrite()||!dbR.mainLoaded)return;dirty=true;clearTimeout(pushT);pushT=setTimeout(flush,400)}
async function flush(){
  if(pushing){pushT=setTimeout(flush,300);return}
  pushing=true;dirty=false;
  try{
    var main=mainPayload(),js=JSON.stringify(main);
    if(js!==lastMain){await DB.doc('menu/main').set(main);lastMain=js}
    for(var k=0;k<S.products.length;k++){var p=S.products[k],cur=p.img||null,prev=dbR.images[p.id]||null;
      if(cur!==prev){if(cur)await DB.doc('images/'+p.id).set({img:cur});else await DB.doc('images/'+p.id).delete();dbR.images[p.id]=cur}}
    var ids=Object.keys(dbR.images);
    for(var n=0;n<ids.length;n++){if(!prod(ids[n])&&dbR.images[ids[n]]){await DB.doc('images/'+ids[n]).delete();dbR.images[ids[n]]=null}}
  }catch(e){toast(L('تعذر المزامنة مع قاعدة البيانات','Could not sync to the database'))}
  pushing=false;if(dirty)flush();
}
async function seedDb(){
  dbR.seeded=true;
  try{
    await DB.doc('menu/main').set(mainPayload());lastMain=JSON.stringify(mainPayload());
    var sample=S.orders.map(function(o){var q=Object.assign({},o);q.uid='seed';return q});
    await DB.doc('orders/seed').set({orders:sample});
    for(var k=0;k<S.products.length;k++){var p=S.products[k];if(p.img){await DB.doc('images/'+p.id).set({img:p.img});dbR.images[p.id]=p.img}}
  }catch(e){}
}
function rebuild(){
  if(!dbR.main){if(dbR.mainLoaded&&!dbR.seeded&&canWrite())seedDb();return}
  var m=dbR.main,orders=[];
  Object.keys(dbR.orderDocs).forEach(function(u){(dbR.orderDocs[u]||[]).forEach(function(o){orders.push(o)})});
  orders.sort(function(a,b){return a.t-b.t});
  S={v:1,seq:0,info:m.info,theme:m.theme,cats:m.cats,extras:m.extras||[],offers:m.offers||[],products:(m.products||[]).map(function(p){var q=Object.assign({},p);q.img=dbR.images[p.id]||null;return q}),orders:orders};
  lastMain=JSON.stringify(mainPayload());lsSet(KEY,JSON.stringify(S));
  if(ui.modal&&ui.modal.kind==='form')return;
  var typing=document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)&&document.activeElement.id!=='q';
  if(typing)return;
  render();if(ui.modal)drawModal();
}
async function sendOrderDb(o){
  var uid=await USER.id();if(!uid)throw new Error('no id');
  o.uid=uid;var ref=DB.doc('orders/'+uid),snap=await ref.get(),arr=snap.exists?(snap.data().orders||[]):[];
  arr.push(o);await ref.set({orders:arr.slice(-30)});
}
async function setOrderStatusDb(o){
  if(!DB||!o.uid)return;
  try{var arr=(dbR.orderDocs[o.uid]||[]).map(function(x){return x.id===o.id?Object.assign({},x,{status:o.status}):x});await DB.doc('orders/'+o.uid).set({orders:arr})}
  catch(e){toast(L('تعذر تحديث حالة الطلب','Could not update order status'))}
}
async function initDb(){
  try{if(!(window.claude&&claude.use))return;DB=await claude.use('db');USER=await claude.use('user')}catch(e){DB=null}
  if(!DB)return;
  try{
    DB.doc('menu/main').onSnapshot(function(sn){dbR.main=sn.exists?sn.data():null;dbR.mainLoaded=true;rebuild()},function(){});
    DB.collection('orders').onSnapshot(function(q){dbR.orderDocs={};q.docs.forEach(function(d){dbR.orderDocs[d.id]=d.data().orders||[]});if(dbR.main)rebuild()},function(){});
    DB.collection('images').onSnapshot(function(q){dbR.images={};q.docs.forEach(function(d){dbR.images[d.id]=d.data().img});if(dbR.main)rebuild()},function(){});
  }catch(e){}
}

load();render();initDb();
})();
</script>
